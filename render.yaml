services:
  - type: web
    name: credit-risk-api
    runtime: docker
    healthCheckPath: /
    disk:
      name: prediction-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/predictions.sqlite3
      - key: FRONTEND_ORIGINS
        sync: false
